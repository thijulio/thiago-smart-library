name: Database
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  packages: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        postgres: ['16.15', '18.6']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: sl_test_admin
          POSTGRES_PASSWORD: sl_test_local_only
          POSTGRES_DB: smart_library_test_admin
        ports: ['55433:5432']
        options: >-
          --health-cmd "pg_isready -U sl_test_admin -d smart_library_test_admin"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DB_TEST_ADMIN_URL: postgresql://sl_test_admin:sl_test_local_only@127.0.0.1:55433/smart_library_test_admin
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          NPM_TOKEN: ${{ github.token }}
      - run: pnpm exec tsx tools/database/bootstrap-test.ts --target local-test --purpose synthetic-test
      - run: pnpm check
      - run: pnpm test:db
