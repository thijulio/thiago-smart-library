[build]
  base = "."
  command = "pnpm build:netlify"
  publish = "dist/apps/web/public"

[build.environment]
  NODE_VERSION = "24"

[functions]
  directory = ".netlify/functions-internal"

# Nitro generates the Netlify function and routing; there is no SPA fallback.
[dev]
  command = "pnpm dev"
  targetPort = 3000
  port = 8888
  framework = "#custom"
